<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KUBER - Knowledge Universe for Business, Earning & Rewards</title>
    <meta name="description" content="KUBER - Knowledge Universe for Business, Earning & Rewards. स्वयं धन के देवता कुबेर का ज्ञान-कोष — permanent KUBER ID, 101 Railway repeat questions, 50 mock tests & student referral rewards." />
    <meta property="og:title" content="KUBER - स्वयं कुबेर का दिव्य ज्ञान एवं समृद्धि आमंत्रण" />
    <meta property="og:description" content="Knowledge Universe for Business, Earning & Rewards. Join via official portal https://ioisplatform.github.io/kuber/ for your permanent KUBER Student ID, study vaults & direct UPI referral rewards." />
    <meta property="og:url" content="https://ioisplatform.github.io/kuber/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var p = window.location.pathname;
        if (p === '/kuber' || p === '/kuber/docs') {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color:#0A0A0A;color:#F3F4F6;margin:0;">
    <div id="root">
      <div style="min-height:100vh;background:#0A0A0A;color:#FFDF73;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;text-align:center;padding:24px;">
        <div style="width:42px;height:42px;border-radius:9999px;border:2px solid rgba(212,175,55,0.25);border-top-color:#FFDF73;margin-bottom:14px;"></div>
        <div style="font-weight:700;font-size:14px;letter-spacing:0.12em;">KUBER • LOADING PORTAL</div>
        <div style="font-size:11px;color:#A1A1AA;margin-top:6px;">Knowledge Universe for Business, Earning &amp; Rewards</div>
      </div>
    </div>
    <!-- KUBER_ROOT_BOOT_START -->
    <script data-kuber-root-boot>
      (function () {
        if (
          document.querySelector('script[src*="@vite/client"]') ||
          document.querySelector('script[src*="/src/main.tsx"]') ||
          document.querySelector('script[src*="./assets/"]') ||
          document.querySelector('script[src*="/assets/"]')
        ) {
          return;
        }
        var s = document.createElement('script');
        s.src = './docs/boot.js?v=' + Date.now();
        s.onerror = function () {
          var root = document.getElementById('root');
          if (root && !window.__KUBER_MOUNTED__) {
            root.innerHTML =
              '<div style="min-height:100vh;background:#0A0A0A;color:#F3F4F6;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;text-align:center;"><div style="max-width:420px;border:1px solid #D4AF37;border-radius:16px;padding:24px;background:#111;"><h2 style="color:#FFDF73;margin:0 0 8px;">KUBER Portal Loading Error</h2><p style="font-size:13px;color:#A1A1AA;margin:0 0 16px;">Could not load portal assets from ./docs/boot.js. Please ensure docs/ folder is pushed or refresh.</p><button onclick="window.location.reload()" style="background:linear-gradient(135deg,#FFDF73,#D4AF37);color:#000;font-weight:700;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;">Reload Portal</button></div></div>';
          }
        };
        document.body.appendChild(s);
      })();
    </script>
    <!-- KUBER_ROOT_BOOT_END -->
  </body>
</html>
